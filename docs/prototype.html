<title>낚시 족보</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen phone app — header, view area, bottom tab bar; on wide screens the phone column is centred */
:root{
  --sea:#0f3b4c; --sea-2:#15536a; --foam:#e8f1f2; --land:#e9e3d3; --land-line:#cfc6b0;
  --bg:#f3f6f6; --card:#ffffff; --fg:#13262e; --muted:#5d7079; --line:#d8e1e3;
  --accent:#ff6a2b; --accent-soft:#ffe6da; --good:#1f9d6b; --warn:#d9930b; --crit:#d6453d;
  --water:#cfe3e8; --water-2:#b9d6dd;
  --font-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1519; --card:#13232a; --fg:#e4eef0; --muted:#93a8b0; --line:#25393f;
  --land:#24302c; --land-line:#34443e; --water:#0f2a33; --water-2:#123642; --foam:#1a313a;
  --accent-soft:#3a2216; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1519; --card:#13232a; --fg:#e4eef0; --muted:#93a8b0; --line:#25393f;
  --land:#24302c; --land-line:#34443e; --water:#0f2a33; --water-2:#123642; --foam:#1a313a;
  --accent-soft:#3a2216; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;overflow:hidden}
.app{max-width:440px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;border-inline:1px solid var(--line)}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--sea);color:#fff}
.logo{font-weight:900;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo .float{width:10px;height:22px;border-radius:5px;background:linear-gradient(var(--accent) 55%,#fff 55%)}
.chip-live{font-size:11px;display:flex;align-items:center;gap:6px;opacity:.9}
.chip-live i{width:7px;height:7px;border-radius:50%;background:#5fe0a6;box-shadow:0 0 0 3px rgba(95,224,166,.25)}
main{flex:1;overflow-y:auto;position:relative;min-height:0}
.view{display:none;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view.on{display:flex;flex-direction:column;gap:14px}
#v-map{padding:0;gap:0;height:100%}
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;font-size:11px;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--fg);font-weight:700}
nav.tabs button.rec .plus{width:42px;height:42px;margin-top:-20px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(255,106,43,.4)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
/* map */
.mapwrap{position:relative;height:100%;min-height:420px;overflow:hidden;background:var(--water)}
.mapwrap svg.map{width:100%;height:100%;display:block}
.pin{cursor:pointer}
.pin:focus-visible circle{stroke:var(--accent);stroke-width:3}
.map-filter{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.pill{all:unset;cursor:pointer;white-space:nowrap;font-size:12px;padding:6px 11px;border-radius:999px;background:var(--card);color:var(--fg);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.pill .dot{width:8px;height:8px;border-radius:50%}
.pill[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill:focus-visible{outline:2px solid var(--accent)}
.map-legend{position:absolute;left:10px;bottom:10px;font-size:10.5px;color:var(--muted);background:var(--card);padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
.mapmode{position:absolute;top:50px;left:10px;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;z-index:2}
.mapmode button{all:unset;cursor:pointer;font-size:11.5px;font-weight:700;padding:7px 10px;text-align:center;color:var(--muted);border-top:1px solid var(--line)}
.mapmode button:first-child{border-top:0}
.mapmode button[aria-pressed="true"]{background:var(--sea);color:#fff}
.tilt{width:100%;height:100%;transition:transform .5s ease}
.mode-3d .tilt{transform:perspective(720px) rotateX(42deg) scale(1.28) translateY(-6%);transform-origin:50% 60%}
.mode-3d{background:linear-gradient(#9fc7e8,#d7e9f3 38%,var(--water) 38%)}
@media (prefers-reduced-motion:reduce){.tilt{transition:none}}
.lvl{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.12);padding:4px 8px 4px 4px;border-radius:999px;cursor:pointer;border:0;color:#fff;font-family:inherit}
.lvl .badge{width:22px;height:22px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-family:var(--font-data);font-size:11px}
.lvl .xpbar{width:46px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
.lvl .xpbar i{display:block;height:100%;background:#ffd36b}
.hero{background:linear-gradient(135deg,var(--sea),var(--sea-2));color:#fff;border-radius:16px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.ring{width:72px;height:72px}
.hero h2{color:#fff}
.hero .xp{height:8px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:8px}
.hero .xp i{display:block;height:100%;background:linear-gradient(90deg,#ffd36b,var(--accent))}
.hero small{opacity:.8;font-size:11.5px}
.trip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.trip .stat{text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal span{aspect-ratio:1;border-radius:6px;background:var(--foam);font-size:10px;display:grid;place-items:center;color:var(--muted);font-family:var(--font-data)}
.cal span.f{background:var(--sea-2);color:#fff;font-weight:700}
.cal span.f2{background:var(--accent);color:#fff;font-weight:700}
.cal span.h{background:none}
.dex{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dex div{border-radius:12px;padding:10px 4px 8px;text-align:center;font-size:11px;background:var(--bg);border:1px solid var(--line)}
.dex div svg{width:44px;height:22px;display:block;margin:0 auto 4px}
.dex div.lock{opacity:.45}
.dex div b{display:block;font-size:11.5px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badges div{text-align:center;font-size:11px;padding:10px 4px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.badges div .m{width:40px;height:40px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;font-size:13px}
.badges div.lock{opacity:.45}
.badges div.lock .m{background:var(--muted)!important}
.quest{display:flex;flex-direction:column;gap:10px}
.quest .q{display:grid;grid-template-columns:1fr auto;gap:4px 8px;font-size:13px}
.quest .q .bar{grid-column:1/-1;margin:0}
.xpfly{position:absolute;left:50%;top:40%;transform:translateX(-50%);z-index:40;font-family:var(--font-data);font-weight:700;font-size:26px;color:var(--accent);text-shadow:0 2px 8px rgba(0,0,0,.2);animation:fly 1.4s ease-out forwards;pointer-events:none}
@keyframes fly{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
@media (prefers-reduced-motion:reduce){.xpfly{animation:none;opacity:0}}
.startfab{all:unset;cursor:pointer;position:absolute;left:50%;bottom:44px;transform:translateX(-50%);background:var(--accent);color:#fff;font-weight:900;font-size:14px;padding:12px 20px;border-radius:999px;box-shadow:0 6px 18px rgba(255,106,43,.45);display:flex;align-items:center;gap:8px;white-space:nowrap}
.startfab:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.sessbar{position:absolute;left:10px;right:10px;bottom:44px;background:var(--sea);color:#fff;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.sessbar .rec{width:10px;height:10px;border-radius:50%;background:#ff5a4f;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.sessbar b{font-family:var(--font-data);font-size:16px}
.sessbar .btn{padding:8px 12px;margin-left:auto}
.mylocate{position:absolute;right:12px;bottom:12px;all:unset;cursor:pointer;position:absolute;width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--sea-2)}
/* sheet */
.sheet-bg{position:absolute;inset:0;background:rgba(5,20,26,.35);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:18px 18px 0 0;max-height:82%;overflow-y:auto;padding:8px 16px 18px;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
h2{font-size:18px;margin:0;font-weight:900;letter-spacing:-.02em;text-wrap:balance}
h3{font-size:14px;margin:0 0 8px;font-weight:700}
.sub{color:var(--muted);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{all:unset;cursor:pointer;text-align:center;font-weight:700;font-size:13px;padding:10px 14px;border-radius:10px;background:var(--foam);color:var(--fg);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:10px}
.stat b{display:block;font-family:var(--font-data);font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.amen{display:flex;flex-direction:column;gap:0}
.amen div{display:grid;grid-template-columns:56px 1fr auto;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:13px;align-items:center}
.amen div:first-child{border-top:0}
.tag{font-size:11px;font-weight:700;color:var(--muted)}
.tag-open{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.open{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.soon{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.closed{background:color-mix(in srgb,var(--crit) 15%,transparent);color:var(--crit)}
.jokbo-line{background:var(--accent-soft);border-radius:12px;padding:12px;font-size:13px;line-height:1.55}
.jokbo-line b{color:var(--accent)}
/* toast */
.toast{position:absolute;top:10px;left:10px;right:10px;z-index:30;background:var(--sea);color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer;animation:drop .35s ease-out}
.toast .ic{flex:none;width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.toast p{margin:2px 0 0;font-size:12.5px;line-height:1.45;opacity:.92}
.toast strong{font-size:13.5px}
.toast .x{all:unset;cursor:pointer;margin-left:auto;opacity:.7;padding:0 4px;font-size:18px;line-height:1}
@keyframes drop{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.spin{animation:none!important}}
/* conditions */
.cond{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cond .stat b{font-size:17px}
.updated{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.spin{display:inline-block;width:10px;height:10px;border:2px solid var(--line);border-top-color:var(--good);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.alert{border-radius:12px;padding:11px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start;background:color-mix(in srgb,var(--warn) 14%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.alert b{color:var(--warn)}
.tide svg{width:100%;height:auto;display:block}
.seg{display:flex;background:var(--foam);border-radius:10px;padding:3px;gap:3px}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;font-size:12.5px;padding:7px 0;border-radius:8px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* jokbo */
.rank{display:flex;flex-direction:column;gap:8px}
.rank .r{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;font-size:13px}
.rank .n{font-family:var(--font-data);color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--foam);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:4px}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--muted);height:100%;justify-content:flex-end}
.bars .b i{width:100%;border-radius:5px 5px 2px 2px;background:var(--sea-2);min-height:2px}
.bars .b.best i{background:var(--accent)}
.bars .b em{font-style:normal;font-family:var(--font-data);color:var(--fg);font-size:11px}
/* record */
.photo{border:2px dashed var(--line);border-radius:14px;aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;text-align:center;color:var(--muted);cursor:pointer;position:relative;overflow:hidden;background:var(--card)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
input[type=text],input[type=number],select,textarea{font:inherit;font-size:14px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;box-sizing:border-box}
textarea{min-height:64px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.auto{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.auto .stat{padding:8px}
.auto .stat b{font-size:13.5px}
.list{display:flex;flex-direction:column}
.list .it{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.thumb{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th,table.t td{text-align:left;padding:8px 4px;border-top:1px solid var(--line)}
table.t th{color:var(--muted);font-weight:700;font-size:11.5px;border-top:0}
.note{font-size:11.5px;color:var(--muted);line-height:1.5}
.sample{font-size:10.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.copybox{font-family:var(--font-data);font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;word-break:break-all;user-select:all}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="logo"><span class="float" aria-hidden="true"></span>낚시 족보</div>
    <div class="row" style="gap:10px;flex-wrap:nowrap"><div class="chip-live" id="liveChip"><i></i><span id="liveText">실시간</span></div><button class="lvl" id="lvlChip" aria-label="내 레벨 보기"><span class="badge" id="lvlNum">1</span><span id="lvlName">입문</span><span class="xpbar"><i id="lvlBar" style="width:0%"></i></span></button></div>
  </header>
  <main id="main">
    <section class="view on" id="v-map" aria-label="지도"></section>
    <section class="view" id="v-sea" aria-label="바다 정보"></section>
    <section class="view" id="v-rec" aria-label="기록하기"></section>
    <section class="view" id="v-jokbo" aria-label="족보"></section>
    <section class="view" id="v-more" aria-label="나"></section>
  </main>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-v="map" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>지도</button>
    <button role="tab" data-v="sea" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 15c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2M2 19c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"/><circle cx="17" cy="6" r="3"/></svg>바다 정보</button>
    <button role="tab" data-v="rec" aria-selected="false" class="rec"><span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg></span>기록</button>
    <button role="tab" data-v="jokbo" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg>족보</button>
    <button role="tab" data-v="more" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>나</button>
  </nav>
</div>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SPECIES={
  '감성돔':'#3a6ea5','볼락':'#8a5cc2','고등어':'#1f9d8b','갈치':'#9aa7ad','무늬오징어':'#e0794a','우럭':'#6b7a3a','학꽁치':'#c9a227'
};
const TIDES=['조금','무시','1물','2물','3물','4물','5물','6물','7물','8물','9물','10물','11물','12물','13물'];
const POINTS=[
 {id:'p1',name:'송정 방파제',type:'방파제',x:268,y:212,
  amen:{toilet:['공중화장실','방파제 입구 120m'],food:['바다횟집','280m','21:00'],food2:['송정 해장국','350m','15:00'],shop:['송정낚시','150m','19:00'],park:['공영주차장','90m · 1시간 1,000원']}},
 {id:'p2',name:'청사포 갯바위',type:'갯바위',x:212,y:300,
  amen:{toilet:['공중화장실','포구 앞 200m'],food:['청사포 조개구이','240m','23:00'],food2:['포구 카페','180m','20:00'],shop:['청사포 미끼','210m','18:00'],park:['포구 주차장','150m · 무료']}},

// live conditions (prototype: simulated drift)
const live={temp:16.8,air:12.4,wind:3.1,windDir:'북동',wave:0.6,tideIdx:8,updated:new Date()};
function tick(){live.temp=+(live.temp+(Math.random()-.5)*.1).toFixed(1);live.air=+(live.air+(Math.random()-.5)*.3).toFixed(1);live.wind=Math.max(.5,+(live.wind+(Math.random()-.5)*.4).toFixed(1));live.wave=Math.max(.2,+(live.wave+(Math.random()-.5)*.06).toFixed(1));live.updated=new Date();renderLiveBits();}
setInterval(tick,20000);
function hhmm(d){return d.toTimeString().slice(0,5)}
function agoText(){const s=Math.round((Date.now()-live.updated)/1000);return s<10?'방금 갱신':s+'초 전 갱신'}
setInterval(()=>{document.querySelectorAll('[data-ago]').forEach(e=>e.textContent=agoText())},1000);

// helpers
const ptById=id=>POINTS.find(p=>p.id===id);
function topSpecies(pt){const m={};CATCHES.filter(c=>c.pt===pt).forEach(c=>m[c.sp]=(m[c.sp]||0)+c.n);return Object.entries(m).sort((a,b)=>b[1]-a[1]);}
function bestRig(pt,sp){const m={};CATCHES.filter(c=>c.pt===pt&&c.sp===sp).forEach(c=>m[c.rig]=(m[c.rig]||0)+c.n);const e=Object.entries(m).sort((a,b)=>b[1]-a[1])[0];return e?e[0]:'-'}
function bestTide(sp,pt){const m={};CATCHES.filter(c=>c.sp===sp&&(!pt||c.pt===pt)).forEach(c=>m[c.tide]=(m[c.tide]||0)+c.n);const e=Object.entries(m).sort((a,b)=>b[1]-a[1])[0];return e?e[0]:'-'}
function bestHour(sp,pt){const m={};CATCHES.filter(c=>c.sp===sp&&(!pt||c.pt===pt)).forEach(c=>{const h=+c.time.slice(0,2);const k=h<9?'새벽~아침':h<16?'낮':h<19?'해질녘':'밤';m[k]=(m[k]||0)+c.n});const e=Object.entries(m).sort((a,b)=>b[1]-a[1])[0];return e?e[0]:'-'}
function openStatus(close){if(close==='24시간')return['open','영업 중 · 24시간'];if(/개점/.test(close))return['closed',close];const now=new Date();const [h,m]=close.split(':').map(Number);let c=new Date(now);c.setHours(h,m,0,0);if(h<5)c.setDate(c.getDate()+1);const diff=(c-now)/60000;if(diff<0)return['closed',close+' 영업 종료'];if(diff<=60)return['soon',close+' 종료 · '+Math.round(diff)+'분 남음'];return['open',close+'까지 영업'];}

function tideSVG(){
  // semidiurnal curve, period 12.42h, for today
  const W=360,H=120,pad=22;const now=new Date();const hNow=now.getHours()+now.getMinutes()/60;
  const lvl=h=>Math.cos((h-4.3)/12.42*2*Math.PI);
  let d='';for(let h=0;h<=24;h+=.25){const x=pad+h/24*(W-2*pad);const y=H/2-lvl(h)*(H/2-20);d+=(h?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}
  const pts=[];for(let h=0;h<24;h+=.05){const a=lvl(h),b=lvl(h-.05),c=lvl(h+.05);if(a>b&&a>=c)pts.push([h,'만조']);if(a<b&&a<=c)pts.push([h,'간조'])}
  const fmt=h=>String(Math.floor(h)).padStart(2,'0')+':'+String(Math.round((h%1)*60)%60).padStart(2,'0');
  const xN=pad+hNow/24*(W-2*pad),yN=H/2-lvl(hNow)*(H/2-20);
  return `<svg viewBox="0 0 ${W} ${H+18}" role="img" aria-label="오늘 조석 곡선">
   <path d="${d} L${W-pad} ${H} L${pad} ${H} Z" fill="var(--water)"/><path d="${d}" fill="none" stroke="var(--sea-2)" stroke-width="2"/>
   ${pts.map(([h,k])=>{const x=pad+h/24*(W-2*pad),y=H/2-lvl(h)*(H/2-20);return `<circle cx="${x}" cy="${y}" r="3" fill="var(--sea-2)"/><text x="${x}" y="${k==='만조'?y-8:y+15}" text-anchor="middle" font-size="10" fill="var(--fg)" font-family="IBM Plex Mono,monospace">${k} ${fmt(h)}</text>`}).join('')}
   <line x1="${xN}" x2="${xN}" y1="6" y2="${H}" stroke="var(--accent)" stroke-dasharray="3 3"/><circle cx="${xN}" cy="${yN}" r="5" fill="var(--accent)" stroke="#fff" stroke-width="2"/>
   ${[0,6,12,18,24].map(h=>`<text x="${pad+h/24*(W-2*pad)}" y="${H+14}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${String(h).padStart(2,'0')}시</text>`).join('')}
  </svg>`;
}

   <div class="seg" role="group" aria-label="보기"><button aria-pressed="${jkMode==='species'}" data-m="species">어종별</button><button aria-pressed="${jkMode==='point'}" data-m="point">포인트별</button><button aria-pressed="${jkMode==='today'}" data-m="today">오늘 추천</button></div>

   <div class="chips" role="group" aria-label="어종">${sps.map(s=>`<button class="pill" aria-pressed="${s===jkSp}" data-js="${esc(s)}"><span class="dot" style="background:${SPECIES[s]}"></span>${esc(s)}</button>`).join('')}</div>
   ${bestPt?`<div class="jokbo-line"><b>${esc(jkSp)}</b>은 <b>${esc(bestPt.name)}</b>에서 가장 많이 잡혔고, <b>${esc(rigRank[0][0])}</b>가 잘 먹혔어요. 수온 <b>${tmin.toFixed(1)}~${tmax.toFixed(1)}°C</b> 사이에 나왔어요. <span class="sub">(기록 ${cs.length}회 기준)</span></div>`:''}
   <div class="card"><h3>잘 나온 포인트</h3><div class="rank">${ptRank.map(([id,v],i)=>`<div class="r"><span class="n">${i+1}</span><div>${esc(ptById(id).name)}<div class="bar"><i style="width:${v/ptRank[0][1]*100}%;background:${SPECIES[jkSp]}"></i></div></div><span class="n">${v}마리</span></div>`).join('')}</div></div>
   <div class="card"><h3>물때별 마릿수</h3>${bars(gv,gmax)}</div>
   <div class="card"><h3>시간대별 마릿수</h3>${bars(hv,hmax)}</div>
   <div class="card"><h3>잘 된 채비</h3><div class="rank">${rigRank.map(([k,v],i)=>`<div class="r"><span class="n">${i+1}</span><span>${esc(k)}</span><span class="n">${v}마리</span></div>`).join('')}</div></div>
   <div class="card"><h3>최근 기록</h3><div class="list">${cs.slice(0,6).map(itemHTML).join('')}</div></div>
   `:jkMode==='point'?pointView():todayView()}
  `;
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{jkMode=b.dataset.m;renderJokbo()});

  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{go('map');openPoint(b.dataset.open)});
}
function todayView(){
  const tide=TIDES[live.tideIdx];const near=[tide,TIDES[live.tideIdx-1],TIDES[live.tideIdx+1]];
  const sim=CATCHES.filter(c=>near.includes(c.tide)&&Math.abs(c.temp-live.temp)<2.5);
  const m={};sim.forEach(c=>{const k=c.pt+'|'+c.sp;m[k]=(m[k]||0)+c.n});
  const rec=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,3);
  return `<div class="card"><h3>오늘 조건</h3><p class="sub" style="margin:0">물때 ${tide} · 수온 ${live.temp.toFixed(1)}°C · 풍속 ${live.wind.toFixed(1)}m/s</p></div>
   <p class="sub" style="margin:0">오늘과 물때·수온이 비슷했던 날 ${sim.length}번의 기록에서 골랐어요.</p>
   ${rec.map(([k,v],i)=>{const [pt,sp]=k.split('|');const p=ptById(pt);return `<div class="card"><div class="between"><div><span class="n" style="font-family:var(--font-data);color:var(--muted)">${i+1}</span> <b>${esc(p.name)}</b> · ${esc(sp)}</div><span class="sub">${v}마리</span></div>
     <p class="sub" style="margin:6px 0 10px">${esc(bestRig(pt,sp))} · ${esc(bestHour(sp,pt))}에 잘 됐어요</p><button class="btn" data-open="${pt}">포인트 보기</button></div>`}).join('')||'<p class="sub">비슷한 조건의 기록이 아직 없어요.</p>'}
   <p class="note">2차에서는 입질 예보와 모두의 족보를 더해 추천이 더 정확해져요.</p>`;
}

// ---------- ME (game) ----------
const LV=['입문','손맛러','생활낚시인','출조꾼','조사','고수','꾼','명인','전설'];
function stats(){
  const trips=[...new Set(visits().map(v=>v.date))].sort();
  const fish=CATCHES.reduce((s,c)=>s+c.n,0);
  const pts=new Set(CATCHES.map(c=>c.pt)).size;
  let xp=CATCHES.reduce((s,c)=>s+10+c.n*2+(c.cm>=40?20:0),0)+trips.length*30+pts*15+BONUS;
  const lv=Math.min(9,Math.floor(Math.sqrt(xp/60))+1);
  const cur=60*(lv-1)**2,next=60*lv**2;
  const now=new Date();const ym=now.toISOString().slice(0,7);
  const month=trips.filter(d=>d.startsWith(ym)).length;
  const big=CATCHES.slice().sort((x,y)=>y.cm-x.cm)[0];
  const wk=d=>Math.floor((Date.parse(d)/864e5+3)/7);const weeks=new Set(trips.map(wk));let streak=0,w=wk(now.toISOString().slice(0,10));if(!weeks.has(w))w--;while(weeks.has(w)){streak++;w--}
  return {trips,fish,pts,xp,lv,cur,next,month,big,streak};
}
function renderLevel(){const st=stats();$('#lvlNum').textContent=st.lv;$('#lvlName').textContent=LV[st.lv-1];$('#lvlBar').style.width=(st.lv>=9?100:(st.xp-st.cur)/(st.next-st.cur)*100)+'%';return st}
function fishIcon(c){return `<svg viewBox="0 0 44 22" aria-hidden="true"><path d="M4 11c6-8 18-9 28-3l8-5v16l-8-5c-10 6-22 5-28-3Z" fill="${c}"/><circle cx="11" cy="9.5" r="1.6" fill="#fff"/></svg>`}
function xpFly(n){const e=document.createElement('div');e.className='xpfly';e.textContent='+'+n+' XP';$('#app').appendChild(e);setTimeout(()=>e.remove(),1500)}
function renderMore(){

  const now=new Date();const y=now.getFullYear(),m=now.getMonth();const first=new Date(y,m,1).getDay();const days=new Date(y,m+1,0).getDate();
  const tripSet=new Set(st.trips);

  const hm={};visits().forEach(v=>{const h=hm[v.pt]||(hm[v.pt]={name:ptById(v.pt)?ptById(v.pt).name:'-',v:0,c:0,last:''});h.v++;if(v.caught)h.c++;if(v.date>h.last)h.last=v.date});const hist=Object.values(hm).sort((a,b)=>b.v-a.v);
  const rm={};CATCHES.forEach(c=>{if(!rm[c.sp]||c.cm>rm[c.sp].cm)rm[c.sp]={sp:c.sp,cm:c.cm,date:c.date,place:ptById(c.pt).name}});MANUAL.forEach(r=>{if(!rm[r.sp]||r.cm>rm[r.sp].cm)rm[r.sp]={...r,manual:true}});const recs=Object.values(rm).sort((a,b)=>b.cm-a.cm);
  const LOCKED=['참돔','벵에돔','농어','광어','쥐노래미'];
  const got=Object.keys(SPECIES).filter(s=>CATCHES.some(c=>c.sp===s));
  const dex=[...Object.keys(SPECIES).map(s=>[s,got.includes(s),SPECIES[s]]),...LOCKED.map(s=>[s,false,'#9aa7ad'])];
  const best=sp=>{const c=CATCHES.filter(x=>x.sp===sp).sort((a,b)=>b.cm-a.cm)[0];return c?c.cm+'cm':'미발견'};
  const dawn=CATCHES.filter(c=>+c.time.slice(0,2)<7).length,night=CATCHES.filter(c=>+c.time.slice(0,2)>=19).length;
  const B=[['첫 감성돔','감',CATCHES.some(c=>c.sp==='감성돔'),'#3a6ea5'],['40cm 돌파','40',CATCHES.some(c=>c.cm>=40&&c.sp!=='갈치'),'#ff6a2b'],['새벽형 꾼','새',dawn>=3,'#c9a227'],['포인트 개척자','5',st.pts>=5,'#1f9d8b'],['밤낚시 장인','밤',night>=5,'#8a5cc2'],['출조 10회','10',st.trips.length>=10,'#15536a'],['도감 10종','10',got.length>=10,'#6b7a3a'],['출조 50회','50',st.trips.length>=50,'#15536a'],['5짜 감성돔','50',CATCHES.some(c=>c.sp==='감성돔'&&c.cm>=50),'#d6453d']];
  const wkAgo=new Date(Date.now()-7*864e5).toISOString().slice(0,10);
  const wTrips=st.trips.filter(d=>d>=wkAgo).length,wBol=CATCHES.filter(c=>c.sp==='볼락'&&c.date>=wkAgo).reduce((s,c)=>s+c.n,0);
  const Q=[['이번 주 출조 2회',wTrips,2,'+60 XP'],['이번 주 볼락 10마리',wBol,10,'+40 XP'],['새 어종 도감 등록',0,1,'+80 XP']];
  $('#v-more').innerHTML=`
   <div class="hero">
     <svg class="ring" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="31" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="7"/><circle cx="36" cy="36" r="31" fill="none" stroke="#ffd36b" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(pct/100*194.8).toFixed(1)} 194.8" transform="rotate(-90 36 36)"/><text x="36" y="34" text-anchor="middle" font-size="10" fill="#fff" opacity=".8">Lv</text><text x="36" y="50" text-anchor="middle" font-size="20" font-weight="900" fill="#fff" font-family="IBM Plex Mono,monospace">${st.lv}</text></svg>
     <div><small>나의 낚시 등급</small><h2>${LV[st.lv-1]}</h2><div class="xp"><i style="width:${pct}%"></i></div><small>${st.xp} XP · ${st.lv>=9?'최고 등급':'다음 등급 '+LV[st.lv]+'까지 '+(st.next-st.xp)+' XP'}</small></div>
   </div>
   <div class="trip">
     <div class="stat"><b>${st.trips.length}</b><span>총 출조</span></div>
     <div class="stat"><b>${st.month}</b><span>이번 달</span></div>
     <div class="stat"><b>${st.fish}</b><span>총 마릿수</span></div>
     <div class="stat"><b>${st.streak}주</b><span>연속 출조</span></div>
   </div>
   <div class="card"><div class="between"><h3 style="margin:0">장소별 낚시 히스토리</h3><span class="sub">출조 시작 기록 기준</span></div>
     <table class="t" style="margin-top:6px"><tr><th>장소</th><th>방문</th><th>조과</th><th>꽝</th><th>마지막</th></tr>${hist.map(h=>`<tr><td>${esc(h.name)}</td><td style="font-family:var(--font-data)">${h.v}회</td><td style="font-family:var(--font-data);color:var(--good)">${h.c}회</td><td style="font-family:var(--font-data);color:var(--muted)">${h.v-h.c}회</td><td class="sub">${h.last.slice(5).replace('-','.')}</td></tr>`).join('')}</table></div>
   <div class="card"><div class="between"><h3 style="margin:0">어종별 기록고기</h3><button class="btn" id="addRecord" style="padding:6px 10px;font-size:12px">직접 입력</button></div>
     <div class="rank" style="margin-top:10px">${recs.map(r=>`<div class="r"><span class="dot" style="width:10px;height:10px;border-radius:50%;background:${SPECIES[r.sp]||'#9aa7ad'}"></span><div><b>${esc(r.sp)}</b> <span class="sub">${esc(r.place)} · ${r.date.replace(/-/g,'.')}${r.manual?' · 직접 입력':''}</span></div><span style="font-family:var(--font-data);font-weight:700;font-size:15px">${r.cm}cm</span></div>`).join('')}</div></div>
   <div class="card"><div class="between"><h3 style="margin:0">${m+1}월 출조 달력</h3><span class="sub"><span style="color:var(--accent);font-weight:700">■</span> 40cm 이상</span></div>
     <div class="cal" style="margin-top:10px">${['일','월','화','수','목','금','토'].map(d=>`<span class="h" style="font-family:var(--font-body)">${d}</span>`).join('')}${cal}</div></div>
   <div class="card"><div class="between"><h3 style="margin:0">주간 퀘스트</h3><span class="sub">월요일 초기화</span></div>
     <div class="quest" style="margin-top:10px">${Q.map(([t,v,g,r])=>`<div class="q"><span>${t}</span><span class="sub">${Math.min(v,g)}/${g} · ${r}</span><div class="bar"><i style="width:${Math.min(100,v/g*100)}%;background:${v>=g?'var(--good)':'var(--accent)'}"></i></div></div>`).join('')}</div></div>
   <div class="card"><div class="between"><h3 style="margin:0">어종 도감</h3><span class="sub">${got.length} / ${dex.length}종</span></div>
     <div class="dex" style="margin-top:10px">${dex.map(([s,ok,c])=>`<div class="${ok?'':'lock'}">${fishIcon(ok?c:'#9aa7ad')}<b>${ok?esc(s):'???'}</b><span class="sub">${ok?best(s):'미발견'}</span></div>`).join('')}</div></div>
   <div class="card"><div class="between"><h3 style="margin:0">배지</h3><span class="sub">${B.filter(b=>b[2]).length} / ${B.length}</span></div>
     <div class="badges" style="margin-top:10px">${B.map(([t,i,ok,c])=>`<div class="${ok?'':'lock'}"><div class="m" style="background:${c}">${i}</div>${t}</div>`).join('')}</div></div>
   ${st.big?`<div class="card"><h3>나의 최대어</h3><div class="list">${itemHTML(st.big)}</div></div>`:''}
   <div class="card"><h3>금어기 · 포획 금지 체장 <span class="sample">예시</span></h3>

     <tr><td>감성돔</td><td>5.1 ~ 5.31</td><td>25cm 미만</td></tr>
     <tr><td>참돔</td><td>-</td><td>24cm 미만</td></tr>
     <tr><td>넙치(광어)</td><td>-</td><td>35cm 미만</td></tr>
     <tr><td>주꾸미</td><td>5.11 ~ 8.31</td><td>-</td></tr>
     <tr><td>대구</td><td>1.16 ~ 2.15</td><td>35cm 미만</td></tr></table>
    <p class="note">실제 앱은 해양수산부 최신 고시로 갱신하고, 기록할 때 체장 미달이면 알려줘요.</p></div>
   <div class="card"><h3>도착 알림 미리 보기</h3><p class="sub" style="margin:0 0 10px">저장한 포인트 근처에 가면 그 자리의 시즌 족보를 알려줘요.</p><button class="btn" id="demoArrive">송정 방파제 도착 알림 보기</button></div>
   <div class="card"><h3>백업</h3><p class="sub" style="margin:0 0 10px">내 기록 ${CATCHES.filter(c=>!c.sample).length}건 · 이 브라우저에 저장됨</p>
    <div class="row"><button class="btn" id="exportBtn">백업 텍스트 보기</button><button class="btn" id="clearBtn">내 기록 지우기</button></div><div id="backupOut"></div></div>
   <p class="note">지도, 날씨, 편의시설 값은 모두 예시예요. 화면과 흐름을 먼저 확인하는 프로토타입이에요.</p>`;
  $('#demoArrive').onclick=()=>{go('map');arrive()};
  $('#addRecord').onclick=()=>showSheet(`<h2>기록고기 직접 입력</h2><p class="sub">앱을 쓰기 전에 잡은 최대어도 남겨 두세요.</p>
    <label class="f">어종<select id="rSp">${[...Object.keys(SPECIES),...LOCKED].map(x=>`<option>${x}</option>`).join('')}</select></label>
    <div class="grid2"><label class="f">크기(cm)<input type="number" id="rCm" value="50"></label><label class="f">날짜<input type="text" id="rDate" value="2025-12-03"></label></div>
    <label class="f">장소<input type="text" id="rPlace" value="거제 지세포 갯바위"></label>
    <button class="btn primary" id="rOk">기록고기 저장</button>`,()=>{$('#rOk').onclick=()=>{MANUAL.unshift({sp:$('#rSp').value,cm:+$('#rCm').value||0,date:$('#rDate').value||'',place:$('#rPlace').value||'',mine:true});saveExtra();closeSheet();renderMore();toast('기록고기를 저장했어요',esc($('#rSp')?'':'')+'어종별 기록에 반영됐어요',null)}});
  $('#exportBtn').onclick=()=>{$('#backupOut').innerHTML=`<div class="copybox" style="margin-top:10px;max-height:160px;overflow:auto">${esc(JSON.stringify(CATCHES.filter(c=>!c.sample).map(c=>({...c,photo:c.photo?'(사진)':null}))))}</div>`};
  $('#clearBtn').onclick=()=>{const b=$('#clearBtn');if(b.dataset.c){CATCHES=CATCHES.filter(c=>c.sample);saveMine();renderMore()}else{b.dataset.c='1';b.textContent='한 번 더 누르면 지워요'}};
}

function arrive(){
  const id='p1',mm=String(new Date().getMonth()+1).padStart(2,'0');const ms={};CATCHES.filter(c=>c.pt===id&&c.date.slice(5,7)===mm).forEach(c=>ms[c.sp]=(ms[c.sp]||0)+c.n);
  const top=(Object.entries(ms).sort((a,b)=>b[1]-a[1])[0]||topSpecies(id)[0])[0];
  toast('송정 방파제에 도착했어요',`11월엔 <b>${top}</b> 확률이 높아요 · ${esc(bestRig(id,top))}, ${esc(bestTide(top,id))} 전후 ${esc(bestHour(top,id))}. 화장실 120m, 바다횟집 21:00까지.`,()=>openPoint(id));
}

const R={map:renderMap,sea:renderSea,rec:renderRec,jokbo:renderJokbo,more:renderMore};

setTimeout(arrive,1500);
})();
