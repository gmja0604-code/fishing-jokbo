name: Android APK

# main에 올라갈 때마다 안드로이드 설치 파일(APK)을 만들어 GitHub Releases에 올린다.
# 폰에서 받는 주소: https://github.com/gmja0604-code/fishing-jokbo/releases/latest/download/fishing-jokbo.apk
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK (arm64)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk fishing-jokbo.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 낚시 족보 안드로이드 빌드 ${{ github.run_number }}
          body: |
            폰에서 아래 fishing-jokbo.apk를 눌러 내려받고 설치하세요.
            처음 설치할 때 "출처를 알 수 없는 앱 설치"를 허용해야 해요.
            커밋: ${{ github.sha }}
          files: fishing-jokbo.apk
          make_latest: true
